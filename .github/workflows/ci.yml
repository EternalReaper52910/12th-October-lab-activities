name: DevSecOps Complete CI/CD & Security Gate Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Automated Unit/Integration Testing
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Security Integration Tests
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: SAST (Static Application Security Testing)
  # ----------------------------------------------------------------------------
  sast-analysis:
    name: SAST CodeQL & Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize GitHub CodeQL SAST Scanner
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL SAST Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Semgrep SAST Audit
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten

  # ----------------------------------------------------------------------------
  # Job 3: Lab Activity 1 - Docker Container Build & Trivy Security Gate
  # ----------------------------------------------------------------------------
  trivy-container-security-gate:
    name: Lab Activity 1 - Trivy Container Vulnerability Gate
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Remediated Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: devsecops-calc:remediated

      - name: Trivy Scan - Informational (Table Output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-calc:remediated'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy Scan - Security Gate Enforcement (Blocks on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-calc:remediated'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Generate SARIF Security Report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: 'devsecops-calc:remediated'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ----------------------------------------------------------------------------
  # Job 4: Lab Activity 2 - Container Deployment, DAST Baseline Scan & Security Gate
  # ----------------------------------------------------------------------------
  dast-zap-security-gate:
    name: Lab Activity 2 - DAST OWASP ZAP Baseline Security Gate
    runs-on: ubuntu-latest
    needs: [trivy-container-security-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run Application Container
        run: |
          docker build -t devsecops-calc:prod -f Dockerfile .
          docker run -d --name app-container -p 3000:3000 devsecops-calc:prod
          sleep 5
          curl -f http://localhost:3000/health || exit 1

      - name: Execute OWASP ZAP Baseline DAST Scan & Security Gate
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: true

      - name: Run Automated Security Gate Policy Validator
        run: |
          npm ci
          node scripts/run-security-gates.js

      - name: Upload DAST Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-security-report
          path: |
            report_html.html
            report_json.json
            reports/
